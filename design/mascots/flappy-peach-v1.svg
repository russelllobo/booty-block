<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Side-view Flappy Squat peach mascot</title>
  <desc id="desc">A smiling peach facing right with a blinking profile eye and animated cream wings.</desc>

  <defs>
    <linearGradient id="peachBody" x1="65" y1="48" x2="177" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD08A"/>
      <stop offset="0.48" stop-color="#FF8F9F"/>
      <stop offset="1" stop-color="#F25383"/>
    </linearGradient>
    <linearGradient id="peachGlow" x1="78" y1="67" x2="118" y2="136" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3CE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF3CE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wingFill" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFBE3"/>
      <stop offset="1" stop-color="#FFD7DB"/>
    </linearGradient>
    <linearGradient id="leafFill" x1="109" y1="35" x2="177" y2="67" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CE0A8"/>
      <stop offset="1" stop-color="#48AE74"/>
    </linearGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#4B2036" flood-opacity="0.24"/>
    </filter>
  </defs>

  <style>
    #mascot {
      transform-box: fill-box;
      transform-origin: center;
      animation: hover 1.15s ease-in-out infinite alternate;
    }
    #wing-far {
      transform-box: fill-box;
      transform-origin: right bottom;
      animation: flap-far 0.34s cubic-bezier(.45,.02,.55,.98) infinite alternate;
    }
    #wing-near {
      transform-box: fill-box;
      transform-origin: right center;
      animation: flap-near 0.34s cubic-bezier(.45,.02,.55,.98) infinite alternate;
    }
    #eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.2s ease-in-out infinite;
    }
    #leaf {
      transform-box: fill-box;
      transform-origin: left bottom;
      animation: leaf-bob 1.15s ease-in-out infinite alternate;
    }
    @keyframes hover {
      from { transform: translateY(3px) rotate(-1deg); }
      to { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes flap-far {
      from { transform: rotate(15deg) scaleY(0.9); }
      to { transform: rotate(-19deg) scaleY(1.06); }
    }
    @keyframes flap-near {
      from { transform: rotate(24deg) scaleY(0.88); }
      to { transform: rotate(-20deg) scaleY(1.04); }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(0.08); }
    }
    @keyframes leaf-bob {
      from { transform: rotate(-3deg); }
      to { transform: rotate(4deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      #mascot, #wing-far, #wing-near, #eye, #leaf { animation: none; }
    }
  </style>

  <g id="mascot" filter="url(#softShadow)">
    <ellipse cx="121" cy="207" rx="47" ry="8" fill="#4B2036" opacity="0.12"/>

    <g id="wing-far">
      <path d="M105 108C95 80 70 62 53 72C42 79 48 95 61 104C44 99 31 107 34 120C38 133 60 132 81 126Z" fill="url(#wingFill)" stroke="#4B2036" stroke-width="6" stroke-linejoin="round"/>
      <path d="M54 79C69 91 80 103 94 117M42 115C59 116 75 119 88 122" fill="none" stroke="#F2A4B7" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    </g>

    <path d="M120 62C97 39 63 48 51 79C38 113 51 153 80 181C93 194 107 201 122 203C138 199 152 188 164 171C186 142 199 107 188 79C179 56 162 46 144 48C134 49 126 54 120 62Z" fill="url(#peachBody)" stroke="#4B2036" stroke-width="7" stroke-linejoin="round"/>
    <path d="M120 66C109 78 106 94 107 110" fill="none" stroke="#C93F6E" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <path d="M120 66C131 78 134 92 133 105" fill="none" stroke="#C93F6E" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <ellipse cx="88" cy="91" rx="23" ry="31" fill="url(#peachGlow)" transform="rotate(-22 88 91)"/>

    <path d="M119 61C117 49 119 38 126 28" fill="none" stroke="#4B2036" stroke-width="7" stroke-linecap="round"/>
    <g id="leaf">
      <path d="M126 45C138 24 164 24 178 39C165 57 144 62 126 50Z" fill="url(#leafFill)" stroke="#4B2036" stroke-width="6" stroke-linejoin="round"/>
      <path d="M132 48C146 42 156 38 168 38" fill="none" stroke="#D6FFD9" stroke-width="3.5" stroke-linecap="round" opacity="0.82"/>
    </g>

    <g id="wing-near">
      <path d="M112 112C88 95 55 96 46 112C39 124 51 135 68 136C52 143 47 157 58 165C72 176 96 153 113 133Z" fill="url(#wingFill)" stroke="#4B2036" stroke-width="6" stroke-linejoin="round"/>
      <path d="M51 114C70 116 87 122 104 130M61 160C76 149 90 139 106 133" fill="none" stroke="#F2A4B7" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    </g>

    <g id="eye">
      <ellipse cx="153" cy="116" rx="10" ry="13" fill="#3A1F2C"/>
      <circle cx="150" cy="111" r="3.3" fill="#FFFFFF"/>
    </g>
    <path d="M143 99C150 95 158 96 163 100" fill="none" stroke="#7F294F" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
    <path d="M151 145C157 151 168 149 172 142" fill="none" stroke="#7F294F" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
