  <style>
    #mascot {
      transform-box: fill-box;
      transform-origin: center;
      animation: hover 1.15s ease-in-out infinite alternate;
    }
    #wing-far {
      transform-box: fill-box;
      transform-origin: right bottom;
      animation: flap-far .34s cubic-bezier(.45,.02,.55,.98) infinite alternate;
    }
    #wing-near {
      transform-box: fill-box;
      transform-origin: right center;
      animation: flap-near .34s cubic-bezier(.45,.02,.55,.98) infinite alternate;
    }
    #eye {
      transform-box: fill-box;
      transform-origin: center;
      animation: blink 4.2s ease-in-out infinite;
    }
    @keyframes hover {
      from { transform: translateY(3px) rotate(-1deg); }
      to { transform: translateY(-4px) rotate(1deg); }
    }
    @keyframes flap-far {
      from { transform: rotate(15deg) scaleY(.9); }
      to { transform: rotate(-19deg) scaleY(1.06); }
    }
    @keyframes flap-near {
      from { transform: rotate(24deg) scaleY(.88); }
      to { transform: rotate(-20deg) scaleY(1.04); }
    }
    @keyframes blink {
      0%, 44%, 48%, 100% { transform: scaleY(1); }
      46% { transform: scaleY(.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      #mascot, #wing-far, #wing-near, #eye { animation: none; }
    }
  </style>

